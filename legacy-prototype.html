<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Allen 机会研究交互原型</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f4f9;color:#172941;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;font-size:15px;line-height:1.65}
button{font:inherit;cursor:pointer;border:1px solid #d5dfeb;background:white;border-radius:10px;color:#253d5d;padding:10px 15px;min-height:44px}
button:hover{background:#eaf1fd}
button:focus-visible{outline:3px solid #ddad47;outline-offset:3px}
.selected,.primary{background:#225ba8;color:white;border-color:#225ba8}
.shell{max-width:1320px;margin:auto}
header{background:#10253f;color:white;padding:22px 28px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.brand{font-size:28px;font-weight:800;letter-spacing:1px}
.brand span{font-size:13px;font-weight:400;margin-left:12px}
nav{display:flex;gap:8px}
.demo{font-size:12px;color:#f6db9b;margin-left:auto}
main{padding:28px}
.scenario{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:30px}
.scenario small{margin-right:8px}
.intro{display:flex;justify-content:space-between;gap:24px;margin-bottom:24px}
h1{font-size:38px;line-height:1.25;letter-spacing:-1px;margin:12px 0 16px}
h2{font-size:23px;margin:8px 0 14px}
h3{font-size:17px;margin:12px 0}
p{margin:10px 0 18px}
.eyebrow{font-size:12px;letter-spacing:1px;color:#697c96;font-weight:700}
.budget{align-self:center;background:#e4ebf5;border-radius:16px;padding:22px;min-width:190px}
.budget strong{display:block;font-size:26px}
.budget small{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}
.grid.main{grid-template-columns:minmax(0,1.8fr) minmax(240px,1fr)}
.card{padding:24px;border:1px solid #dee6f0;background:white;border-radius:18px;box-shadow:0 6px 20px #17305206}
.compact{margin-bottom:18px}
.badge{font-size:12px;vertical-align:middle;margin-left:12px;border-radius:20px;background:#ebe8fa;color:#6d55a3;padding:6px 12px;display:inline-block}
.danger{color:#a14d42;background:#fcf0ed}
.risk{border-left:3px solid #d7a14b;padding-left:14px}
.mini{font-size:30px;color:#497fae;background:#f2f6fc;padding:15px;border-radius:12px}
.card small{display:block;color:#79879b;margin:12px 0}
.summary{padding:12px 0;color:#50637e}
.summary small{margin-left:14px}
.notice{padding:20px;background:#e9eff8;border-radius:14px;margin:20px 0}
.notice.danger{background:#fcf0ed}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:12px;overflow:auto;padding:10px 0 20px}
.lane{background:#e5ebf4;border-radius:14px;padding:16px;min-height:175px}
.lane p{font-size:13px;color:#7a889e}
.tile{background:white;width:100%;text-align:left}
.timebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timebar small{color:#7b879b}
.chart svg{width:100%;display:block}
.chartkeys{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tools{border-top:1px solid #d5deea;padding:20px 0;margin-top:30px}
.tools summary{cursor:pointer;min-height:44px}
footer{font-size:12px;color:#7b899b;margin:12px 0}
@media(max-width:850px){
  header{padding:18px;gap:14px}
  main{padding:18px}
  .grid.main,.grid{grid-template-columns:1fr}
  .intro{gap:16px}
  h1{font-size:30px}
  .demo{margin-left:0}
}
@media(max-width:520px){
  .intro{display:block}
  .budget{margin-top:18px}
  nav{width:100%;gap:5px}
  nav button{padding:10px}
  .card{padding:18px}
  .scenario{gap:5px}
  .scenario button{padding:8px 10px}
  .lanes{grid-template-columns:repeat(5,165px)}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function prototype(){
const root=document.getElementById('app');
let page='home',scenario='active',selected=0,later=false,marker=1;

const data=[
  {
    name:'示例甲',
    stage:'收窄整理',
    reason:'上涨后的回调量能降低，近期价格区间收窄。',
    doubt:'还没有放量突破，整理可能向下结束。',
    confirm:'已完成日线收盘高于 12.30；成交量达到前 20 日均量的 1.5 倍。',
    invalid:'日线收盘跌破 11.40，结束本条结构假设。'
  },
  {
    name:'示例乙',
    stage:'事件线索',
    reason:'演示公告出现新订单线索，值得核实交付与回款。',
    doubt:'事件可能尚未兑现，也没有价格确认。',
    confirm:'核实订单落地、回款及价格结构；事件与量价证据分别判断。',
    invalid:'订单取消、延期或出现足以推翻原判断的新证据。'
  },
  {
    name:'示例丙',
    stage:'机会失效',
    reason:'原突破位已失守，优先复核旧判断。',
    doubt:'跳空或无法成交时，退出价格可能低于止损条件。',
    confirm:'旧判断结束；重新观察必须另建记录。',
    invalid:'日线收盘低于原突破区 16.80。'
  }
];

const btn=(text,attrs,cls='')=>
  `<button class="${cls}" ${attrs}>${text}</button>`;

const card=(i)=>{
  const d=data[i];
  return `
  <article class="card">
    <div class="eyebrow">
      ${i===1?'事件发现 · 独立证据渠道':
        i===2?'风险复核 · 保留失败记录':'价格结构 · 提前观察'}
    </div>
    <h2>${d.name}
      <span class="badge ${i===2?'danger':''}">${d.stage}</span>
    </h2>
    <p>${d.reason}</p>
    <div class="mini">
      ${i===2?'↗ → ↘　原判断结束':
        i===1?'公告线索　…　等待核实':'↗　↘　≈　…　等待突破'}
    </div>
    <p><b>还差什么</b><br>${d.confirm}</p>
    <p class="risk"><b>何时放弃</b><br>${d.invalid}</p>
    <small>演示数据截止 D60 · 非真实行情</small>
    <div>${btn('打开研究档案 →',`data-stock="${i}"`,'primary')}</div>
  </article>`;
};

function chart(){
  return `
  <div class="chart">
    <svg viewBox="0 0 760 300" role="img"
         aria-label="演示价格与成交量示意图">
      <g stroke="#e4eaf1">
        <path d="M30 50H730M30 100H730M30 150H730M30 200H730"/>
      </g>
      <path
        d="M30 187L70 175L110 160L150 165L190 127L230 136L270 91L310 65L350 82L390 108L430 115L470 104L510 112L550 106L590 110L630 103${later?'L670 142L710 170':''}"
        fill="none"
        stroke="${later?'#bb5752':'#246bce'}"
        stroke-width="4"/>
      <path d="M30 86H730" stroke="#7788a5" stroke-dasharray="6"/>
      <text x="35" y="77" fill="#63718b" font-size="14">
        确认条件示意线 · 非真实价格
      </text>
      <g stroke="#9cabc1" stroke-width="16">
        ${Array.from({length:24},(_,i)=>
          `<path d="M${40+i*28} 266v-${i<12?24+i%4*9:13+i%3*4}"/>`
        ).join('')}
      </g>
      <text x="30" y="293" fill="#63718b" font-size="14">
        D01　　D20　　D40　　　 D60${later?'　D65':'　未来未展开'}
      </text>
    </svg>
    <div class="chartkeys">
      ${btn('① 回调','data-marker="1"',marker===1?'selected':'')}
      ${btn('② 收窄','data-marker="2"',marker===2?'selected':'')}
      ${btn('③ 未确认','data-marker="3"',marker===3?'selected':'')}
    </div>
    <small>价格、量能与标记均为交互示意，不是计算得到的行情。</small>
  </div>`;
}

function render(){
  const focus=scenario==='failed'?2:0;
  let content='';

  if(page==='home'){
    content=`
    <div class="intro">
      <div>
        <div class="eyebrow">TODAY / 优先研究</div>
        <h1>先发现机会，<br>再等证据确认。</h1>
        <p>打开就知道关注谁、为什么、还差什么，以及何时结束判断。</p>
      </div>
      <div class="budget">
        个人风险预算<br>
        <strong>待设置</strong>
        <small>暂不生成仓位建议</small>
      </div>
    </div>`;

    if(scenario==='empty'){
      content+=`
      <div class="notice">
        <h2>今天暂无新增机会</h2>
        <p>演示扫描完成：覆盖 120 / 120，新增信号 0。
        继续等待，已有研究仍需跟踪。</p>
      </div>`;
    }else if(scenario==='missing'){
      content+=`
      <div class="notice danger">
        <h2>数据不足，暂停新判断</h2>
        <p>演示请求 120，成功 0，失败 120。
        不能据此认定没有机会。以下为旧档案，数据已过期。</p>
      </div>`;
    }else{
      content+=`
      <div class="summary">
        提前观察 2　·　已经确认 0　·　风险复核 1
        <small>演示统计；数量不代表成功率</small>
      </div>`;
    }

    content+=`
    <div class="grid main">
      ${card(focus)}
      <aside>
        <div class="card compact">
          <div class="eyebrow">优先复核</div>
          <h2>${scenario==='failed'?'旧判断已结束':'示例丙 · 突破位失守'}</h2>
          <p>先检查失效风险，再决定是否继续等待。
          止损条件不能保证可按指定价格退出。</p>
          ${btn('查看原判断与后来结果','data-stock="2"')}
        </div>
        <div class="card compact">
          <h3>事件雷达</h3>
          <p>示例乙出现公告线索。事件利好仍需独立核实。</p>
          ${btn('核查事件证据','data-stock="1"')}
        </div>
      </aside>
    </div>`;

  }else if(page==='map'){
    content=`
    <div class="eyebrow">EVOLUTION / 可前进，也可退回</div>
    <h1>机会如何发展</h1>
    <p>阶段是研究判断，不是盈利进度。
    允许暂停、倒退、过期与失效。</p>
    <div class="lanes">
      ${['上涨趋势','缩量回调','收窄整理','突破确认','后续验证']
        .map((s,i)=>`
          <section class="lane">
            <small>结构阶段 ${i+1}</small>
            <h3>${s}</h3>
            ${i===2?
              btn('示例甲 · 等待确认 →','data-stock="0"','tile'):
              i===3?'<p>暂无已确认机会</p>':'<p>暂无演示候选</p>'}
          </section>`
        ).join('')}
    </div>
    <div class="grid">
      <section class="card">
        <h2>独立发现渠道：事件雷达</h2>
        <p>公告线索与价格确认分开保留，不能相加成为可靠概率。</p>
        ${btn('示例乙 · 核实交付与回款','data-stock="1"')}
      </section>
      <section class="card risk">
        <h2>失效与暂停档案</h2>
        <p>失败记录继续可见，不从统计中删除。</p>
        ${btn('示例丙 · 原突破位失守','data-stock="2"')}
      </section>
    </div>`;

  }else{
    const d=data[selected];
    const failed=later&&selected!==1;
    const stage=selected===2&&!later?
      '突破观察':failed?'机会失效':d.stage;

    const explanations=[
      null,
      {
        title:'① 为什么判定为回调',
        support:'演示 D28—D40：此前价格上行后出现回落，同时量能降低。',
        doubt:'此前上涨是否达到正式趋势阈值仍待验证；不能只凭缩量认定正常回调。'
      },
      {
        title:'② 为什么观察收窄',
        support:'演示 D51—D60 的区间较此前缩小，等待进一步确认。',
        doubt:'这是示意说明，尚未接入真实区间计算。收窄可以向下突破。'
      },
      {
        title:'③ 为什么突破尚未确认',
        support:'演示 D60 尚未同时满足已完成日线价格与成交量条件。',
        doubt:'盘中突破可能回落；目前不能称为确定买点。'
      }
    ];
    const e=explanations[marker];

    content=`
    <div class="eyebrow">DOSSIER / 一条判断的完整证据</div>
    <h1>${d.name}
      <span class="badge ${failed?'danger':''}">${stage}</span>
    </h1>
    <div class="timebar">
      ${btn('当时判断 · D60','data-time="then"',!later?'selected':'')}
      ${btn('后来结果 · D65','data-time="later"',later?'selected':'')}
      <small>演示记录 · 非真实历史预测</small>
    </div>
    <div class="grid main">
      <section class="card">
        <h3>${selected===1?'事件证据与核实路径':'价格结构与研究标记'}</h3>
        ${selected===1?`
          <div class="notice">
            <b>演示公告 · D55</b>
            <p>虚构新订单线索 → 等待交付 → 核实回款</p>
          </div>
          <p>没有价格确认，不根据公告直接生成买点。</p>
        `:chart()}
      </section>
      <aside class="card">
        <div class="eyebrow">点击标记查看依据</div>
        <h3>${selected===1?'事件为什么值得关注':e.title}</h3>
        <p><b>支持证据</b><br>${selected===1?d.reason:e.support}</p>
        <p class="risk"><b>最重要的疑点</b><br>
          ${selected===1?d.doubt:e.doubt}
        </p>
        <small>来源：演示日线 / 演示公告<br>
        证据截止：D60 · 无真实外部数据</small>
      </aside>
    </div>
    <div class="grid">
      <section class="card">
        <h3>下一项确认条件</h3>
        <p>${selected===2&&!later?
          '原判断：等待价格站稳原突破区域，并持续核实量能。':
          failed?'原判断已结束；需要建立新的研究记录。':d.confirm}
        </p>
        <h3>失效条件</h3>
        <p>${d.invalid}</p>
      </section>
      <section class="card">
        <h3>${later?'后来发生了什么':'保留当时判断'}</h3>
        <p>${later?
          (failed?
            '演示 D65：价格向下，原判断失效。保留失败和未成交记录。':
            '演示 D65：仍未完成核实，继续等待；不强行判定成功。'):
          '演示 D60：提前观察，尚未确认。这里模拟原始记录，并非真实保存的历史预测。'}
        </p>
        <p>可靠概率：暂不提供<br>
        收益风险：仅展示结构条件，不承诺收益。<br>
        实际交易：未发生；价格变化不等于交易收益。</p>
      </section>
    </div>`;
  }

  root.innerHTML=`
  <div class="shell">
    <header>
      <div class="brand">Allen<span>机会研究台</span></div>
      <nav>
        ${btn('今日机会','data-page="home"',page==='home'?'selected':'')}
        ${btn('机会演化','data-page="map"',page==='map'?'selected':'')}
        ${btn('个股档案','data-page="dossier"',page==='dossier'?'selected':'')}
      </nav>
      <div class="demo">交互原型 · 全部为虚构演示</div>
    </header>
    <main>
      <div class="scenario">
        <small>体验状态</small>
        ${[
          ['active','有机会'],
          ['empty','暂无机会'],
          ['missing','数据不足'],
          ['failed','机会失效']
        ].map(([id,t])=>
          btn(t,`data-scenario="${id}"`,scenario===id?'selected':'')
        ).join('')}
      </div>
      ${content}
      <details class="tools">
        <summary>原网站能力接入规划 · 展开查看</summary>
        <p>股票池、搜索 → 发现入口；
        公司、财务、行业、投资逻辑 → 档案证据；
        趋势预测、风险分析 → 经验证后接入；
        AI研究对话 → 证据辅助；
        持仓组合、费用、简报 → 计划与跟踪。</p>
        <p>这些为保留入口规划，本原型未连接实际功能。</p>
      </details>
      <footer>
        私有演示 · 不自动下单 · 未连接数据库或模型 · 风险预算待设置
      </footer>
    </main>
  </div>`;
}

root.addEventListener('click',e=>{
  const el=e.target.closest('button');
  if(!el)return;
  const d=el.dataset;
  if(d.page)page=d.page;
  if(d.stock!==undefined){
    selected=Number(d.stock);
    page='dossier';
    later=false;
  }
  if(d.scenario){
    scenario=d.scenario;
    page='home';
  }
  if(d.time)later=d.time==='later';
  if(d.marker)marker=Number(d.marker);
  render();
});

render();
})();
</script>
</body>
</html>
