name: Long-history controlled model comparison
on:
  push:
    branches: [research/long-history-development-v2]
    paths: ['research/**', '.github/workflows/long-history-development.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: long-history-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  experiment:
    if: github.ref == 'refs/heads/research/long-history-development-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: ''
      AI_API_KEY: ''
      FORECAST_API_URL: ''
      OMP_NUM_THREADS: '2'
      PYTHONHASHSEED: '20261110'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze exact current-list sample and verified calendar before requests
        run: node research/prepare.mjs
      - name: Install fixed research dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Test calendars, warmup, missing data, shared cohorts and isolation
        run: |
          set -euo pipefail
          mkdir -p experiment-logs
          node --test research/*.test.mjs 2>&1 | tee experiment-logs/dataset-tests.log
          python -m unittest discover -s research -p 'test_*.py' -v 2>&1 | tee experiment-logs/training-tests.log
      - name: Archive 2020-2025 histories without requesting final test daily bars
        run: |
          set -euo pipefail
          node research/fetch-history.mjs experiment-out 2>&1 | tee experiment-logs/history.log
      - name: Compare three data regimes and nine independent fixed model fits
        run: |
          set -euo pipefail
          python research/compare_long_history.py experiment-out/dataset.json experiment-out/training --calendar research/calendar.json 2>&1 | tee experiment-logs/training.log
      - name: Hash experiment outputs and preserve actual dependency versions
        if: always()
        run: |
          mkdir -p experiment-logs
          python -m pip freeze > experiment-logs/pip-freeze.txt
          node research/archive.mjs experiment-out
      - name: Retain raw data, all nine results, models, exclusions and complete predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allen-long-history-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            experiment-out/
            experiment-logs/
            research/
          if-no-files-found: error
          retention-days: 90
