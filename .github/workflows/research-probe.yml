name: Research public source probe
on:
  push:
    branches: [upgrade/personal-pages-v1]
    paths: ['.github/workflows/research-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Read public endpoints only
        run: |
          node --input-type=module <<'JS'
          const jobs=[
           ['performance-bulk',"https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_LICO_FN_CPD&columns=ALL&filter=(REPORTDATE%3D%272026-09-30%27)&pageSize=3&pageNumber=1&sortTypes=-1&sortColumns=UPDATE_DATE&source=WEB&client=WEB"],
           ['finance-old','https://datacenter.eastmoney.com/securities/api/data/v1/get?reportName=RPT_F10_FINANCE_MAINFINADATA&columns=ALL&filter=(SECUCODE%3D%22600036.SH%22)&pageNumber=1&pageSize=3&sortTypes=-1&sortColumns=REPORT_DATE&source=HSF10&client=PC'],
           ['company-old','https://emweb.securities.eastmoney.com/PC_HSF10/CompanySurvey/CompanySurveyAjax?code=SH600036'],
           ['announcements-old','https://np-anotice-stock.eastmoney.com/api/security/ann?sr=-1&page_size=3&page_index=1&ann_type=A&client_source=web&stock_list=600036'],
           ['finance-bulk','https://datacenter.eastmoney.com/securities/api/data/v1/get?reportName=RPT_F10_FINANCE_MAINFINADATA&columns=ALL&pageNumber=1&pageSize=3&sortTypes=-1&sortColumns=REPORT_DATE&source=HSF10&client=PC'],
           ['income-bulk','https://datacenter.eastmoney.com/securities/api/data/v1/get?reportName=RPT_DMSK_FN_INCOME&columns=ALL&pageNumber=1&pageSize=3&sortTypes=-1&sortColumns=REPORT_DATE&source=HSF10&client=PC'],
           ['news-feed','https://np-anotice-stock.eastmoney.com/api/security/ann?sr=-1&page_size=10&page_index=1&ann_type=A&client_source=web'],
           ['finance-sz','https://datacenter.eastmoney.com/securities/api/data/v1/get?reportName=RPT_F10_FINANCE_MAINFINADATA&columns=ALL&filter=(SECUCODE%3D%22300750.SZ%22)&pageNumber=1&pageSize=3&sortTypes=-1&sortColumns=REPORT_DATE&source=HSF10&client=PC']
          ];
          await Promise.all(jobs.map(async([name,url])=>{
           try{
            const response=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0 AllenPersonalResearch/1',Accept:'application/json'},signal:AbortSignal.timeout(15000)});
            const body=await response.text();let data;try{data=JSON.parse(body)}catch{console.log('RESEARCH_PROBE='+JSON.stringify({name,status:response.status,format:'not_json',preview:body.slice(0,160)}));return}
            const rows=data?.result?.data||data?.data?.list;
            console.log('RESEARCH_PROBE='+JSON.stringify({name,status:response.status,keys:Object.keys(data),success:data.success,code:data.code,message:data.message,pages:data.result?.pages,count:data.result?.count,dataKeys:data.data&&Object.keys(data.data),rows:Array.isArray(rows)?rows.length:null,sample:Array.isArray(rows)?rows.slice(0,2):data.jbzl||data}).slice(0,18000));
           }catch(error){console.log('RESEARCH_PROBE='+JSON.stringify({name,error:error.message}))}
          }));
          
          JS
